name: Playwright Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # Logs in ONCE and shares the session with every shard.
  #
  # Each shard is a separate runner and .auth/ is gitignored, so each shard used to authenticate
  # itself — 4 near-simultaneous logins. The app answers that with "Account temporarily locked
  # due to suspicious login attempts", every shard then fails at the OTP step
  # (login.js:27, waiting for input[placeholder="******"]) and ~88 tests per shard never run.
  #
  # auth.setup.js validates any existing .auth/user.json and skips the login when it is still
  # good, so the shards below reuse this session instead of creating three more.
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: pull repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Log in once and save the session
        run: npx playwright test --project=setup
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Confirm the session file was written
        run: ls -la .auth/

      - name: Share the session with the shards
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: .auth/
          # REQUIRED: ".auth" is a hidden directory (leading dot) and upload-artifact@v4 skips
          # hidden files by default, so this reported "No files were found with the provided
          # path: .auth/" even though the login had written user.json correctly.
          include-hidden-files: true
          # Fail loudly rather than handing the shards an empty artifact, which would send every
          # one of them back to logging in and reproduce the lockout.
          if-no-files-found: error
          retention-days: 1

      - name: Upload login failure artefacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-failure
          path: test-results/
          retention-days: 1

  test:
    needs: [auth]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: pull repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Restore the shared session
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: .auth

      - name: Run Playwright tests (shard ${{ matrix.shard }}/8)
        run: npx playwright test --shard=${{ matrix.shard }}/8  --reporter=blob
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Upload blob report (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload test results (traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 2

  merge-reports:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: pull repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 7
